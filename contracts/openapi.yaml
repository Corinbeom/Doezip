components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CodingResult:
      type: object
      additionalProperties: false
      required:
      - name
      - passed
      - detail
      properties:
        name:
          type: string
          maxLength: 80
        passed:
          type: boolean
        detail:
          type: string
          maxLength: 500
    CodingRun:
      type: object
      additionalProperties: false
      required:
      - version
      - suite
      - results
      properties:
        version: &codingSchema002
          type: integer
          format: int64
          minimum: 0
        suite:
          type: string
          enum:
          - duplicate-items-v1
        results:
          type: array
          items:
            $ref: '#/components/schemas/CodingResult'
          minItems: 1
          maxItems: 10
    CodingTurn:
      type: object
      additionalProperties: false
      required:
      - id
      - requestKey
      - baseVersion
      - baseCode
      - instruction
      - status
      - explanation
      - proposedCode
      properties:
        id: &codingSchema001
          type: string
          format: uuid
        requestKey: *codingSchema001
        baseVersion: *codingSchema002
        baseCode: &codingSchema003
          type: string
        instruction: *codingSchema003
        status:
          type: string
          enum:
          - RUNNING
          - SUCCEEDED
          - FAILED
        explanation:
          type: string
          nullable: true
        proposedCode:
          type: string
          nullable: true
    CodingWorkspace:
      type: object
      additionalProperties: false
      required:
      - id
      - taskVersion
      - code
      - version
      - submittedAt
      - explanation
      - lastRun
      - turns
      properties:
        id: *codingSchema001
        taskVersion:
          type: string
          enum:
          - duplicate-items-v1
        code: *codingSchema003
        version: *codingSchema002
        submittedAt:
          type: string
          nullable: true
        explanation:
          type: string
          nullable: true
        lastRun:
          allOf:
          - $ref: '#/components/schemas/CodingRun'
          nullable: true
        turns:
          type: array
          items:
            $ref: '#/components/schemas/CodingTurn'
    CodingSave:
      type: object
      additionalProperties: false
      required:
      - code
      - expectedVersion
      properties:
        code:
          type: string
          maxLength: 20000
        expectedVersion: *codingSchema002
    CodingAsk:
      type: object
      additionalProperties: false
      required:
      - requestKey
      - expectedVersion
      - instruction
      properties:
        requestKey: *codingSchema001
        expectedVersion: *codingSchema002
        instruction:
          type: string
          minLength: 1
          maxLength: 4000
    CodingSubmit:
      type: object
      additionalProperties: false
      required:
      - expectedVersion
      - explanation
      properties:
        expectedVersion: *codingSchema002
        explanation:
          type: string
          minLength: 1
          maxLength: 4000
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        details:
          type: object
          additionalProperties: true
      required:
      - code
      - message
      - requestId
    User:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        displayName:
          type: string
        email:
          type: string
          format: email
          nullable: true
      required:
      - id
      - displayName
      - email
    BootstrapRequest:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
    Rubric:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        area:
          type: string
          enum:
          - PROMPT
          - EVIDENCE
          - DOCUMENT
          - DEFENSE
        title:
          type: string
        description:
          type: string
      required:
      - code
      - area
      - title
      - description
    Task:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        taskCode:
          type: string
        versionNo:
          type: integer
          minimum: 1
        title:
          type: string
        descriptionMarkdown:
          type: string
        status:
          type: string
          enum:
          - PUBLISHED
          - ARCHIVED
        rubrics:
          type: array
          items:
            $ref: '#/components/schemas/Rubric'
      required:
      - id
      - taskCode
      - versionNo
      - title
      - descriptionMarkdown
      - status
      - rubrics
    TaskList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Task'
      required:
      - items
    MaterialSummary:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        title: &id002
          type: string
        type: &id003
          type: string
          enum:
          - ARCHITECTURE
          - LOG
          - METRIC
          - DEPLOYMENT
          - EXTERNAL_SERVICE
          - CUSTOMER_NOTE
        sortOrder: &id004
          type: integer
          minimum: 1
      required:
      - id
      - title
      - type
      - sortOrder
    Material:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        title: *id002
        type: *id003
        sortOrder: *id004
        contentMarkdown:
          type: string
        contentHash: &id005
          type: string
          pattern: ^[0-9a-f]{64}$
        lines:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              number:
                type: integer
                minimum: 1
              text:
                type: string
            required:
            - number
            - text
      required:
      - id
      - title
      - type
      - sortOrder
      - contentMarkdown
      - contentHash
      - lines
    Session:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        taskId: *id001
        status:
          type: string
          enum:
          - ACTIVE
          - COMPLETED
          - ABANDONED
        currentStep:
          type: string
          enum:
          - WRITING
          - CHALLENGE
          - FEEDBACK
          - FOLLOW_UP
          - CONDITION_CHANGE
          - FINAL_REVIEW
          - DONE
        mode:
          type: string
          enum:
          - PRACTICE
        conditionReleasedAt:
          type: string
          format: date-time
          nullable: true
        allowedActions:
          type: array
          items:
            type: string
            enum:
            - READ_MATERIALS
            - WRITE_DRAFT
            - SEND_MESSAGE
            - SNAPSHOT_INITIAL
            - START_CHALLENGE
            - EDIT_CHALLENGE
            - SUBMIT_CHALLENGE
            - REQUEST_INITIAL_EVALUATION
            - READ_INITIAL_REPORT
            - START_FOLLOW_UPS
            - ANSWER_FOLLOW_UPS
            - REVEAL_CONDITION
            - SNAPSHOT_FINAL
            - ANSWER_CONDITION
            - REQUEST_FINAL_EVALUATION
            - READ_FINAL_REPORT
            - RETRY_EVALUATION
      required:
      - id
      - taskId
      - status
      - currentStep
      - mode
      - conditionReleasedAt
      - allowedActions
    Draft:
      type: object
      additionalProperties: false
      properties:
        markdown:
          type: string
        lockVersion:
          type: integer
          minimum: 0
        contentHash: *id005
      required:
      - markdown
      - lockVersion
      - contentHash
    SessionCreateRequest:
      type: object
      additionalProperties: false
      properties:
        taskId: *id001
      required:
      - taskId
    Workspace:
      type: object
      additionalProperties: false
      properties:
        session:
          $ref: '#/components/schemas/Session'
        task:
          $ref: '#/components/schemas/Task'
        materials:
          type: array
          items:
            $ref: '#/components/schemas/MaterialSummary'
        draft:
          $ref: '#/components/schemas/Draft'
        challengeRunId:
          type: string
          format: uuid
          nullable: true
        initialReportId:
          type: string
          format: uuid
          nullable: true
        finalReportId:
          type: string
          format: uuid
          nullable: true
        activeEvaluationId:
          type: string
          format: uuid
