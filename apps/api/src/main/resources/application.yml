server:
  address: 127.0.0.1
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 4
      connection-timeout: 3000
      validation-timeout: 1000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
  health:
    defaults:
      enabled: false
    db:
      enabled: true
app:
  cors-allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}
  auth:
    enabled: ${AUTH_ENABLED:false}
    issuer: ${AUTH_ISSUER:}
    jwk-set-uri: ${AUTH_JWK_SET_URI:}
    audience: ${AUTH_AUDIENCE:authenticated}
    provider-id: ${AUTH_PROVIDER_ID:}
