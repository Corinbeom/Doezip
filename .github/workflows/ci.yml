name: CI
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop, 'feature/**']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  environment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: cp .env.example .env
      - run: npx playwright install --with-deps chromium
      - run: npm run db:up
      - run: npm run check
      - name: Build deployable API image
        run: docker build -f apps/api/Dockerfile -t doezip-api:ci .
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-results
          path: |
            playwright-report/
            test-results/
            apps/api/build/reports/tests/
      - name: Stop CI database without deleting volumes
        if: always()
        run: docker compose --env-file .env -f compose.local.yml down
